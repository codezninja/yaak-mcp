name: Publish

# Publishing a GitHub Release whose tag is v<package.json version> stages that version on npm.
# A maintainer then approves it on npmjs.com (or `npm stage approve <id>`) with 2FA.
# Auth is npm trusted publishing (GitHub OIDC), so there is no NPM_TOKEN secret. The
# trusted publisher (repo codezninja/yaak-mcp, workflow publish.yml, environment npm)
# is stage-only, so plain `npm publish` from here is rejected.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Check tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version"
            exit 1
          fi

      # Staged publishing needs npm 11.15.0 or later; Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: mise run check

      - name: Build
        run: mise run build

      - name: Stage publish
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm stage publish --tag next
          else
            npm stage publish
          fi
